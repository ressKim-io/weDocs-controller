# proto → Markdown 문서 생성. `make proto-doc` 으로 실행.
# 출력: docs/proto/api-reference.md — 전체 서비스·메시지·필드 레퍼런스.
# CI(proto-ci.yml doc-freshness job)가 이 출력의 최신성을 검증한다.
version: v2
clean: true
inputs:
  - directory: proto
plugins:
  - remote: buf.build/community/pseudomuto-doc
    out: docs/proto
    opt:
      - markdown,docs/proto/api-reference.md
