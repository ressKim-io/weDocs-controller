name: claude-context-budget

# 상시 로드 컨텍스트 예산 게이트.
# 측정 대상 = CLAUDE.md + .claude/rules/ 중 paths: 없는 것 + 실제 @import(재귀).
# 표준: docs/plans/2026-07-28-claude-context-budget.md · ci/README.md §컨텍스트 예산
#
# 한계(정직하게): 이 레포는 CLAUDE.md §커밋·push 규칙상 main 직접 push라
# pull_request 레그는 controller 변경에 실제로 걸리지 않는다. push 레그는 사후 탐지다.
# 실시간 차단은 .claude/settings.json의 PostToolUse 훅이 담당한다.
on:
  pull_request:
    paths:
      - "CLAUDE.md"
      - ".claude/**"
      - "scripts/claude_context_budget.py"
      - ".github/workflows/claude-context-budget.yml"
  push:
    branches: [main]
    paths:
      - "CLAUDE.md"
      - ".claude/**"
      - "scripts/claude_context_budget.py"
  workflow_dispatch: # 임계값 조정(래칫) 후 즉시 검증용

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6 # security-scan.yml과 동일 버전
      # fetch-depth 기본(1) — 예산은 워킹트리 스냅샷만 보면 되므로 히스토리 불요.
      # (gitleaks와 달리 과거 커밋에 묻힌 값을 캘 이유가 없다)
      - name: 상시 로드 컨텍스트 예산 검사
        run: python3 scripts/claude_context_budget.py --tier all
